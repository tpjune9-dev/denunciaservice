spring.application.name=denunciaservice
server.port=${PORT:8080}

# Conexión MySQL Dinámica (Render toma variables de entorno; si no existen, usa tu localhost)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bd_denuncias?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true